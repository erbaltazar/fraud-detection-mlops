apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-api-baseline
  namespace: argocd
spec:
  project: default
  source:
    # CRITICAL: Update this URL to match your exact GitHub repository
    repoURL: 'https://github.com/erbaltazar/fraud-detection-mlops.git'
    targetRevision: main
    path: infrastructure/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true