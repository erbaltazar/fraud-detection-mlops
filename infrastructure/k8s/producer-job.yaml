apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-data-stream
spec:
  suspend: false
  template:
    spec:
      containers:
      - name: producer
        image: ghcr.io/erbaltazar/fraud-detection-mlops:latest
        command: ["python", "src/streaming/producer.py"]
        envFrom:
        - secretRef:
            name: fraud-api-secrets
      restartPolicy: Never
  backoffLimit: 1
