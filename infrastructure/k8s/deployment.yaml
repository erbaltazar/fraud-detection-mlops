apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-api
  namespace: default
  labels:
    app: fraud-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: fraud-api
          image: ghcr.io/erbaltazar/fraud-detection-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          
          # Infisical Operator Integration
          envFrom:
            - secretRef:
                name: fraud-api-secrets
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
              
          # Strict constraints for your 12GB ARM node
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10