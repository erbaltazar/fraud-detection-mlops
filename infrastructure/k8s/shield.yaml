---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-finops-shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-shield
  template:
    metadata:
      labels:
        app: finops-shield
    spec:
      containers:
      - name: cpu-burner
        image: alpine:latest
        # This command runs an infinite text loop, generating pure CPU load
        command: ["/bin/sh", "-c", "while true; do yes > /dev/null; done"]
        resources:
          requests:
            cpu: "300m"
          limits:
            cpu: "500m" # Caps at exactly 1/4 of your 2-core Oracle Node