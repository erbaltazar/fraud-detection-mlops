---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast-deployment
  namespace: default
  labels:
    app: feast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feast
  template:
    metadata:
      labels:
        app: feast
    spec:
      containers:
        - name: feast
          image: ghcr.io/erbaltazar/fraud-detection-mlops:latest
          workingDir: /app/src/features
          command: ["feast", "serve"]
          args:
            - "--host=0.0.0.0"
            - "--port=6566"
          envFrom:
            - secretRef:
                name: fraud-api-secrets
          ports:
            - containerPort: 6566
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: feast-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: feast
  ports:
    - protocol: TCP
      port: 6566
      targetPort: 6566