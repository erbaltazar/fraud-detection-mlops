apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fraud-detection-api
  namespace: default
  labels:
    app: fraud-api
spec:
  replicas: 2
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {} # Pauses indefinitely for Evidently AI drift monitoring
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: fraud-api
          image: ghcr.io/erbaltazar/fraud-detection-mlops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: fraud-api-secrets
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10