project: fraud_detection
registry: data/registry.db
provider: local
online_store:
  type: redis
  connection_string: rediss://:${FEAST_REDIS_PASSWORD}@${FEAST_REDIS_HOST}
offline_store:
  type: postgres
  host: ${POSTGRES_HOST}
  port: 5432
  database: ${POSTGRES_DB}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}